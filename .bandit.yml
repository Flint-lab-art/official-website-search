# bandit 安全扫描配置
# 用法: bandit -r core -c .bandit.yml
#
# 以下跳过项均经人工核验，为确定性误报：
# - B608: SQL 列名拼接来自内部白名单 _ENGINE_COLS / ENGINES（固定引擎名→固定列名），
#   非外部输入，无法参数化；与 ruff S608 同源判定
# - B311: random 仅用于请求间隔/防风控抖动，非加密/安全用途
# - B110/B112: 爬虫页面元素探测（弹窗关闭、可选元素），元素不存在时静默跳过是
#   健壮性写法，捕获后 continue/pass 是有意行为
skips:
  - B608
  - B311
  - B110
  - B112
